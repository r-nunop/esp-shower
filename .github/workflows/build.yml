name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que la etiqueta coincide con PROJECT_VER
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER=$(sed -n 's/^set(PROJECT_VER "\(.*\)")/\1/p' CMakeLists.txt)
          if [ "v$VER" != "$GITHUB_REF_NAME" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con PROJECT_VER ($VER)"
            exit 1
          fi

      - name: Compilar con ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.1
          target: esp32
          path: '.'

      - name: Publicar el binario en una Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/S_PockShower.bin \
            --title "$GITHUB_REF_NAME" --notes "Firmware $GITHUB_REF_NAME para OTA"
